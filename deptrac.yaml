# T0.2: each module owns its layers; cross-module calls target only permitted Api layers.
# Native effects, WordPress function calls, raw SQL and $wpdb are checked by bin/check-architecture.php.
deptrac:
  paths:
    - ./src
  cache_file: .deptrac.cache
  analyser:
    types: [class, function, function_call, file, use, class_superglobal, function_superglobal]
  layers:
    - name: Php
      collectors:
        - type: php_internal
          value: '.*'
    - name: WordPress
      collectors:
        - type: classLike
          value: '^(WP_.*|wpdb|Walker.*|Requests.*|IXR_.*)$'
    - name: Vendor
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^(RentalManager\\Vendor\\|ActionScheduler).*'
    - name: KernelContracts
      collectors:
        - type: interface
          value: '^RentalManager\\Kernel\\'
    - name: KernelValues
      collectors:
        - type: classLike
          value: '^RentalManager\\Kernel\\(Money|Time|Id)\\'
    - name: KernelInfrastructure
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^RentalManager\\Kernel\\(Db|Migrations|Outbox|Jobs|Sequences|Storage|Audit|Health|Http|Security|I18n)\\'
          must_not:
            - type: layer
              value: 'KernelContracts'
            - type: layer
              value: 'KernelValues'
    - name: Kernel
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^RentalManager\\Kernel\\'
          must_not:
            - type: layer
              value: 'KernelContracts'
            - type: layer
              value: 'KernelValues'
            - type: layer
              value: 'KernelInfrastructure'
    - name: Platform.Api
      collectors:
        - type: classLike
          value: '^RentalManager\\Modules\\Platform\\Api\\'
    - name: Platform.Domain
      collectors:
        - type: classLike
          value: '^RentalManager\\Modules\\Platform\\Domain\\'
    - name: Platform.ApplicationPorts
