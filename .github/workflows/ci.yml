name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WP_VERSION: '7.1.4'

permissions:
  contents: read

jobs:
  backend:
    name: PHP ${{ matrix.php }} / ${{ matrix.database.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.5']
        database:
          - name: MySQL 8.0
            image: mysql:8.0
            health: mysqladmin ping -h 127.0.0.1 -ptest-password
          - name: MariaDB 10.6
            image: mariadb:10.6
            health: healthcheck.sh --connect --innodb_initialized
        include:
          - php: '8.3'
            database:
              name: MySQL 5.7.44
              image: mysql:5.7.44
              health: mysqladmin ping -h 127.0.0.1 -ptest-password
              version: '5.7.44'
    env:
      RM_EXPECT_DB_VERSION: ${{ matrix.database.version || '' }}
    services:
      mysql:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: rental_manager_test
          MARIADB_ROOT_PASSWORD: test-password
          MARIADB_DATABASE: rental_manager_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.database.health }}"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, mysqli, sodium, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - name: Generate the synthetic Arabic RTL PDF spike
        run: php bin/spike-pdf.php
      - run: composer check
      - name: Run T0.3 Integration and Api suites
        env:
          RM_ALLOW_TEST_DB_RESET: '1'
          WP_CORE_DIR: ${{ runner.temp }}/rm-integration-core
          WP_TESTS_DIR: ${{ runner.temp }}/rm-integration-tests
        run: |
          bash bin/install-wp-tests.sh rm_test_rental_manager root test-password 127.0.0.1:3306 "$WP_VERSION"
          composer test:integration
      - name: Assemble runtime release with the original Action Scheduler
        run: bash bin/package.sh "$RUNNER_TEMP/release"
      - name: Render the Arabic sample using only packaged fonts
        run: php bin/spike-pdf.php --package "$RUNNER_TEMP/release/rental-manager"
      - name: Install clean WordPress and activate the plugin
        env:
          RM_TEST_WP_DIR: ${{ runner.temp }}/wordpress
          RM_TEST_DB_PASSWORD: test-password
        run: |
          curl --fail --silent --show-error --location "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          ln -s "$RUNNER_TEMP/release/rental-manager" "$RM_TEST_WP_DIR/wp-content/plugins/rental-manager"
          php bin/smoke-wordpress.php

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Test the frontend CI gate
        run: node --test tests/CI/frontend-gate.test.mjs
      - name: Check frontend scaffold prerequisites
        id: scaffold
        run: node bin/ci-frontend.mjs
      - name: Install locked frontend dependencies
        if: steps.scaffold.outputs.enabled == 'true'
        run: npm --prefix frontend ci
      - name: Build frontend
        if: steps.scaffold.outputs.enabled == 'true'
        run: npm --prefix frontend run build
      - name: Verify committed frontend build is current
        if: steps.scaffold.outputs.enabled == 'true'
        run: |
          git diff --exit-code -- build/
          status="$(git status --porcelain --untracked-files=all -- build/)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo 'Rebuild and commit the complete build/ directory.' >&2
            exit 1
          fi
      - name: Install Chromium for frontend tests
        if: steps.scaffold.outputs.enabled == 'true'
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Run frontend browser tests
        if: steps.scaffold.outputs.enabled == 'true'
        env:
          CI: 'true'
        run: npm --prefix frontend test
