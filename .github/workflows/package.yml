name: Package plugin

# Builds an installable plugin package from a branch (default: main).
# Download the "rental-manager-plugin" artifact from the run page and upload it in
# Extract the Actions artifact, then upload rental-manager.zip in WordPress.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to package"
        required: false
        default: main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.1'
          extensions: gd, mbstring, sodium, zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies and prefix them (Strauss)
        run: composer install --no-interaction --prefer-dist
      - name: Assemble runtime plugin
        run: bash bin/package.sh "$RUNNER_TEMP/package"
      - name: Render the Arabic sample using only packaged fonts
        run: php bin/spike-pdf.php --package "$RUNNER_TEMP/package/rental-manager"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rental-manager-plugin
          path: ${{ runner.temp }}/package/rental-manager.zip
          retention-days: 30
